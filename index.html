<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recebimentos Bahia - Grupo Boticário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORES = [
      { id: 'SIMOES_FILHO', label: 'HUB - SIMÕES FILHO (V084)' },
      { id: 'PITUBA', label: 'ER PITUBA (V078)' },
      { id: 'CAJAZEIRAS', label: 'ER CAJAZEIRAS (V070)' },
      { id: 'CALCADA', label: 'ER CALÇADA (V074)' },
      { id: 'LAURO_FREITAS', label: 'ER LAURO DE FREITAS (V072)' }
    ];

    // DADOS MAPEADOS RIGOROSAMENTE CONFORME SUAS ORIENTAÇÕES:
    // - HUB SIMÕES FILHO: Status = Coluna U (SITUAÇÃO) | Previsão = Coluna H (PREVISÃO RECEBIMENTO)
    // - DEMAIS LOJAS: Status = Coluna M (STATUS) | Previsão = Coluna E (DATA RECEBIMENTO)
    const INITIAL_NOTES = [
      // HUB - SIMÕES FILHO
      { id: '850802', fornecedor: 'QDB', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'INTEGRADA', prev_recebimento: '07/10/2025', valor: 6810.41, integrado: true },
      { id: '523172', fornecedor: 'ANTILHAS', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'INTEGRADA', prev_recebimento: '07/10/2025', valor: 7319.22, integrado: true },
      { id: '851769', fornecedor: 'EUDORA', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'INTEGRADA', prev_recebimento: '14/10/2025', valor: 249877.66, integrado: true },
      { id: '975531', fornecedor: 'EUDORA', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 175.31, integrado: false },
      { id: '975532', fornecedor: 'EUDORA', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 18175.18, integrado: false },
      { id: '975533', fornecedor: 'EUDORA', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 85121.46, integrado: false },
      { id: '975327', fornecedor: 'BOTICÁRIO', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 569861.12, integrado: false },
      { id: '975328', fornecedor: 'BOTICÁRIO', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 18641.15, integrado: false },
      { id: '975329', fornecedor: 'BOTICÁRIO', loja_nome: 'HUB - SIMÕES FILHO (V084)', loja_key: 'SIMOES_FILHO', status: 'AGUARDANDO INTEGRAÇÃO', prev_recebimento: '11/08/2026', valor: 4074.00, integrado: false },

      // PITUBA
      { id: '848208', fornecedor: 'EUDORA', loja_nome: 'ER PITUBA (V078)', loja_key: 'PITUBA', status: 'FORA DO PRAZO', prev_recebimento: '01/10/2025', valor: 15400.00, integrado: false },
      { id: '000763', fornecedor: 'TRANSFERÊNCIA', loja_nome: 'ER PITUBA (V078)', loja_key: 'PITUBA', status: 'NO PRAZO', prev_recebimento: '13/07/2026', valor: 2310.00, integrado: true },
      { id: '975319', fornecedor: 'BOTICÁRIO', loja_nome: 'ER PITUBA (V078)', loja_key: 'PITUBA', status: 'NO PRAZO', prev_recebimento: '07/08/2026', valor: 8900.00, integrado: true },

      // CAJAZEIRAS
      { id: '271323', fornecedor: 'ANTILHAS', loja_nome: 'ER CAJAZEIRAS (V070)', loja_key: 'CAJAZEIRAS', status: 'NO PRAZO', prev_recebimento: '26/06/2026', valor: 1141.45, integrado: true },
      { id: '975320', fornecedor: 'BOTICÁRIO', loja_nome: 'ER CAJAZEIRAS (V070)', loja_key: 'CAJAZEIRAS', status: 'NO PRAZO', prev_recebimento: '07/08/2026', valor: 14200.00, integrado: true },

      // CALÇADA
      { id: '971158', fornecedor: 'CALAMO', loja_nome: 'ER CALÇADA (V074)', loja_key: 'CALCADA', status: 'FORA DO PRAZO', prev_recebimento: '24/07/2026', valor: 6781.07, integrado: false },
      { id: '975321', fornecedor: 'BOTICÁRIO', loja_nome: 'ER CALÇADA (V074)', loja_key: 'CALCADA', status: 'NO PRAZO', prev_recebimento: '07/08/2026', valor: 9800.00, integrado: true },

      // LAURO DE FREITAS
      { id: '332110', fornecedor: 'BOTICÁRIO', loja_nome: 'ER LAURO DE FREITAS (V072)', loja_key: 'LAURO_FREITAS', status: 'NO PRAZO', prev_recebimento: '28/07/2026', valor: 24350.00, integrado: true },
      { id: '978121', fornecedor: 'BOTICÁRIO', loja_nome: 'ER LAURO DE FREITAS (V072)', loja_key: 'LAURO_FREITAS', status: 'NO PRAZO', prev_recebimento: '15/08/2026', valor: 18900.00, integrado: true }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('SIMOES_FILHO');
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('Todos');
      const [notes, setNotes] = useState(INITIAL_NOTES);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiChatOpen, setAiChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'gemini', text: 'Olá! Sou o Gemini, assistente corporativo Boticário. Como posso ajudar com o recebimento das notas?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // FILTRAGEM
      const filteredNotes = notes.filter(n => {
        const matchTab = n.loja_key === activeTab;
        const matchSearch = n.id.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            n.fornecedor.toLowerCase().includes(searchTerm.toLowerCase());
        const matchStatus = statusFilter === 'Todos' ? true : n.status === statusFilter;
        return matchTab && matchSearch && matchStatus;
      });

      const totalNotas = filteredNotes.length;
      const notasRecebidas = filteredNotes.filter(n => n.status === 'INTEGRADA' || n.status === 'NO PRAZO').length;
      const pendentesIntegracao = filteredNotes.filter(n => n.status === 'AGUARDANDO INTEGRAÇÃO' || n.status === 'FORA DO PRAZO' || n.status === 'PENDENTE').length;
      const notasIntegradasCount = filteredNotes.filter(n => n.integrado).length;

      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        const labels = ['SIMÕES FILHO', 'PITUBA', 'CAJAZEIRAS', 'CALÇADA', 'LAURO DE FREITAS'];
        const storeKeys = ['SIMOES_FILHO', 'PITUBA', 'CAJAZEIRAS', 'CALCADA', 'LAURO_FREITAS'];

        const integradasData = storeKeys.map(k => notes.filter(n => n.loja_key === k && n.integrado).length);
        const pendentesData = storeKeys.map(k => notes.filter(n => n.loja_key === k && !n.integrado).length);

        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: 'Integradas / No Prazo', data: integradasData, backgroundColor: '#10b981', borderRadius: 6 },
              { label: 'Aguardando / Fora do Prazo', data: pendentesData, backgroundColor: '#ef4444', borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: 'Acompanhamento das Notas Fiscais', font: { size: 14, weight: 'bold' } }
            },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }, [notes, activeTab]);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const handleSimulateAiUpload = () => {
        setIsAnalyzing(true);
        setTimeout(() => {
          const currentStore = STORES.find(s => s.id === activeTab);
          const newNote = {
            id: `${Math.floor(900000 + Math.random() * 90000)}`,
            fornecedor: 'BOTICÁRIO LOGÍSTICA',
            loja_nome: currentStore.label,
            loja_key: activeTab,
            status: activeTab === 'SIMOES_FILHO' ? 'AGUARDANDO INTEGRAÇÃO' : 'NO PRAZO',
            prev_recebimento: '21/08/2026',
            valor: 15400.00,
            integrado: activeTab !== 'SIMOES_FILHO'
          };
          setNotes([newNote, ...notes]);
          setIsAnalyzing(false);
          setIsModalOpen(false);
        }, 1800);
      };

      const handleSendMessage = () => {
        if (!chatInput.trim()) return;
        const newMsgs = [...chatMessages, { sender: 'user', text: chatInput }];
        setChatMessages(newMsgs);
        setChatInput('');
        setTimeout(() => {
          setChatMessages([...newMsgs, { sender: 'gemini', text: `Analisando a base do Grupo Boticário... Encontrei ${totalNotas} notas na aba selecionada.` }]);
        }, 1000);
      };

      const getStatusStyle = (status) => {
        switch(status) {
          case 'INTEGRADA':
          case 'NO PRAZO':
            return 'bg-emerald-900 text-emerald-100 border-emerald-700';
          case 'FORA DO PRAZO':
            return 'bg-red-900 text-red-100 border-red-700';
          case 'AGUARDANDO INTEGRAÇÃO':
          case 'PENDENTE':
            return 'bg-amber-100 text-amber-900 border-amber-300';
          default:
            return 'bg-slate-800 text-white';
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* CABEÇALHO COM LOGOMARCA GRUPO BOTICÁRIO */}
          <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center shadow-sm sticky top-0 z-30">
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200">
                  <svg className="w-8 h-8" viewBox="0 0 100 100" fill="none">
                    <path d="M50 15C32 15 20 30 20 50C20 70 35 85 55 85C70 85 82 72 82 55C82 38 68 25 50 25C38 25 28 35 28 50C28 62 38 72 50 72C60 72 68 64 68 52" stroke="#82c341" strokeWidth="12" strokeLinecap="round"/>
                    <path d="M50 25C65 25 78 38 78 55C78 70 65 82 50 82" stroke="#009cde" strokeWidth="10" strokeLinecap="round"/>
                    <path d="M55 45C65 45 72 52 72 62C72 72 62 80 50 80" stroke="#f37021" strokeWidth="10" strokeLinecap="round"/>
                  </svg>
                  <div className="flex flex-col leading-tight">
                    <span className="text-xs font-bold text-slate-700 tracking-tight">Grupo</span>
                    <span className="text-sm font-extrabold text-slate-900 tracking-tight">Boticário</span>
                  </div>
                </div>
                <span className="text-slate-300 text-2xl font-light">|</span>
                <span className="font-semibold text-slate-700 text-sm tracking-tight">Recebimentos Bahia</span>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="hidden sm:inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-medium border border-emerald-200">
                <i data-lucide="shield-check" className="w-4 h-4"></i> Acesso Restrito a Funcionários
              </span>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-slate-900">Notas Fiscais</h1>
                <p className="text-xs md:text-sm text-slate-500">Gerencie, consulte e acompanhe suas NF-e por loja</p>
              </div>
              <button onClick={() => setIsModalOpen(true)} className="bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm px-4 py-2.5 rounded-lg flex items-center gap-2 shadow transition">
                <i data-lucide="plus" className="w-4 h-4"></i> Nova Nota
              </button>
            </div>

            {/* ABAS UNIFICADAS */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 border-b border-slate-200">
              {STORES.map((s) => {
                const count = notes.filter(n => n.loja_key === s.id).length;
                const isActive = activeTab === s.id;
                return (
                  <button key={s.id} onClick={() => setActiveTab(s.id)} className={`px-4 py-2 text-xs font-semibold rounded-t-lg flex items-center gap-2 border-b-2 whitespace-nowrap transition ${isActive ? 'border-slate-900 text-slate-900 bg-white shadow-sm' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}>
                    <span>{s.label}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] ${isActive ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-600'}`}>{count}</span>
                  </button>
                );
              })}
            </div>

            {/* CARDS DE MÉTRICAS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Total de Notas</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{totalNotas}</p></div>
                <div className="p-2.5 bg-slate-100 text-slate-600 rounded-lg"><i data-lucide="file-text" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">No Prazo / Integradas</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{notasRecebidas}</p></div>
                <div className="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle-2" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Aguardando / Fora Prazo</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{pendentesIntegracao}</p></div>
                <div className="p-2.5 bg-red-50 text-red-500 rounded-lg"><i data-lucide="alert-circle" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Notas Integradas</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{notasIntegradasCount}</p></div>
                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="clock" className="w-5 h-5"></i></div>
              </div>
            </div>

            {/* GRÁFICO */}
            <div className="bg-white p-5 rounded-xl border shadow-sm">
              <div className="h-64 w-full"><canvas ref={chartRef}></canvas></div>
            </div>

            {/* BUSCA E FILTROS DE STATUS */}
            <div className="bg-white p-4 rounded-xl border shadow-sm space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                <div className="md:col-span-8 relative">
                  <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                  <input type="text" placeholder="Buscar por número ou fornecedor..." className="w-full pl-9 pr-3 py-2 text-xs border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                </div>
                <div className="md:col-span-4">
                  <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="w-full py-2 px-3 text-xs border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white">
                    <option value="Todos">Todos os status</option>
                    <option value="INTEGRADA">INTEGRADA</option>
                    <option value="AGUARDANDO INTEGRAÇÃO">AGUARDANDO INTEGRAÇÃO</option>
                    <option value="NO PRAZO">NO PRAZO</option>
                    <option value="FORA DO PRAZO">FORA DO PRAZO</option>
                  </select>
                </div>
              </div>
            </div>

            {/* TABELA AJUSTADA COM AS NOVAS REGRAS */}
            <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-600">
                  <thead className="bg-slate-50 border-b text-slate-700 font-semibold uppercase">
                    <tr>
                      <th className="p-4">Número/Série</th>
                      <th className="p-4">Loja</th>
                      <th className="p-4">Status</th>
                      <th className="p-4">Previsão de Recebimento</th>
                      <th className="p-4">Valor Total</th>
                      <th className="p-4 text-center">Ações</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredNotes.length > 0 ? (
                      filteredNotes.map((note) => (
                        <tr key={note.id} className="hover:bg-slate-50 transition">
                          <td className="p-4">
                            <div className="font-bold text-slate-900">{note.id}</div>
                            <div className="text-[11px] text-slate-400">{note.fornecedor}</div>
                          </td>
                          <td className="p-4">
                            <span className="bg-slate-100 text-slate-800 font-medium px-2 py-1 rounded text-[11px] border">
                              {note.loja_nome}
                            </span>
                          </td>
                          <td className="p-4">
                            <span className={`px-2.5 py-1 rounded text-[10px] font-bold border inline-block ${getStatusStyle(note.status)}`}>
                              {note.status}
                            </span>
                          </td>
                          <td className="p-4 font-semibold text-slate-800">
                            {note.prev_recebimento}
                          </td>
                          <td className="p-4 font-bold text-slate-900">
                            R$ {note.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                          </td>
                          <td className="p-4 text-center">
                            <div className="flex justify-center gap-3 text-slate-400">
                              <i data-lucide="eye" className="w-4 h-4 cursor-pointer hover:text-slate-800"></i>
                              <i data-lucide="pencil" className="w-4 h-4 cursor-pointer hover:text-slate-800"></i>
                              <i data-lucide="trash-2" className="w-4 h-4 cursor-pointer hover:text-red-500"></i>
                            </div>
                          </td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="6" className="p-8 text-center text-slate-400">
                          Nenhuma nota fiscal encontrada para a loja selecionada.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* CHATBOT GEMINI INTEGRADO */}
          <div className="fixed bottom-5 right-5 z-40">
            {aiChatOpen ? (
              <div className="bg-white rounded-2xl shadow-2xl border w-80 sm:w-96 flex flex-col h-96 overflow-hidden">
                <div className="bg-slate-900 text-white p-3.5 flex justify-between items-center">
                  <div className="flex items-center gap-2"><div className="p-1 bg-emerald-500 rounded text-white"><i data-lucide="bot" className="w-4 h-4"></i></div><span className="font-bold text-xs">Gemini (Boticário)</span></div>
                  <button onClick={() => setAiChatOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs bg-slate-50">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] p-2.5 rounded-xl ${msg.sender === 'user' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-700 shadow-sm'}`}>{msg.text}</div>
                    </div>
                  ))}
                </div>
                <div className="p-2 border-t bg-white flex gap-1.5">
                  <input type="text" placeholder="Pergunte sobre NFs..." className="flex-1 border rounded-lg px-3 py-1.5 text-xs focus:outline-none" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()} />
                  <button onClick={handleSendMessage} className="bg-slate-900 text-white p-2 rounded-lg"><i data-lucide="send" className="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            ) : (
              <button onClick={() => setAiChatOpen(true)} className="bg-slate-900 text-white p-3.5 rounded-full shadow-lg flex items-center gap-2 hover:bg-slate-800"><i data-lucide="sparkles" className="w-5 h-5 text-emerald-400"></i><span className="text-xs font-semibold pr-1">Gemini AI</span></button>
            )}
          </div>

          {/* MODAL OCR */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-800 text-base">Nova Nota Fiscal (Gemini OCR)</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="border-2 border-dashed rounded-xl p-6 text-center space-y-3 bg-slate-50">
                  <i data-lucide="upload-cloud" className="w-10 h-10 text-slate-400 mx-auto"></i>
                  <p className="text-xs text-slate-600 font-semibold">Arraste seu arquivo PDF/XML da NF</p>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 border text-xs rounded-lg text-slate-600">Cancelar</button>
                  <button onClick={handleSimulateAiUpload} disabled={isAnalyzing} className="px-4 py-2 bg-slate-900 text-white text-xs rounded-lg">{isAnalyzing ? 'Processando IA...' : 'Simular Leitura Gemini'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
