  <style>

  </style>
</head>
<body>

    const STORES = [

      { id: '975530', fornecedor: 'EUDORA', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 10499.67, loja: 'SIMOES_FILHO', data: '2026-08-07' },
      { id: '975531', fornecedor: 'EUDORA', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 175.31, loja: 'SIMOES_FILHO', data: '2026-08-07' },

      { id: '975328', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 18641.15, loja: 'SIMOES_FILHO', data: '2026-08-07' },
      { id: '975329', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 4074.00, loja: 'SIMOES_FILHO', data: '2026-08-07' },
      { id: '733802', fornecedor: 'ANTILHAS', cnpj: '35260802096748', tipo: 'Entrada', status: 'FORA DO PRAZO', integrado: false, valor: 37309.20, loja: 'SIMOES_FILHO', data: '2026-08-04' },

      { id: '978105', fornecedor: 'EUDORA', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 48760.28, loja: 'SIMOES_FILHO', data: '2026-08-15' },
      { id: '978127', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 1079751.16, loja: 'SIMOES_FILHO', data: '2026-08-15' },
      { id: '978128', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 33835.65, loja: 'SIMOES_FILHO', data: '2026-08-15' },
      { id: '978129', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 7802.99, loja: 'SIMOES_FILHO', data: '2026-08-15' },
      { id: '978130', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'DENTRO DO PRAZO', integrado: true, valor: 202.05, loja: 'SIMOES_FILHO', data: '2026-08-15' },

      // PITUBA (JULHO / AGOSTO 2026)
      { id: '848208', fornecedor: 'EUDORA', cnpj: '29250906147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 15400.00, loja: 'PITUBA', data: '2026-07-15' },
      { id: '000763', fornecedor: 'TRANSFERÊNCIA', cnpj: '29260711137051', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 2310.00, loja: 'PITUBA', data: '2026-07-13' },
      { id: '975319', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 8900.00, loja: 'PITUBA', data: '2026-08-07' },
      { id: '733875', fornecedor: 'ANTILHAS', cnpj: '35260802096748', tipo: 'Entrada', status: 'FORA DO PRAZO', integrado: false, valor: 12400.00, loja: 'PITUBA', data: '2026-08-04' },
      { id: '976102', fornecedor: 'QDB', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 4500.00, loja: 'PITUBA', data: '2026-08-10' },
      { id: '978119', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 31200.00, loja: 'PITUBA', data: '2026-08-15' },

      // CAJAZEIRAS (JULHO / AGOSTO 2026)
      { id: '271323', fornecedor: 'ANTILHAS', cnpj: '35260602096748', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 1141.45, loja: 'CAJAZEIRAS', data: '2026-07-18' },
      { id: '975320', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 14200.00, loja: 'CAJAZEIRAS', data: '2026-08-07' },
      { id: '978120', fornecedor: 'EUDORA', cnpj: '29260806147451', tipo: 'Entrada', status: 'FORA DO PRAZO', integrado: false, valor: 8600.00, loja: 'CAJAZEIRAS', data: '2026-08-15' },

      // CALÇADA (JULHO / AGOSTO 2026)
      { id: '971158', fornecedor: 'CALAMO', cnpj: '29260706147451', tipo: 'Entrada', status: 'FORA DO PRAZO', integrado: false, valor: 6781.07, loja: 'CALCADA', data: '2026-07-25' },
      { id: '975321', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 9800.00, loja: 'CALCADA', data: '2026-08-07' },

      // LAURO DE FREITAS (JULHO / AGOSTO 2026)
      { id: '332110', fornecedor: 'BOTICÁRIO', cnpj: '11137051084690', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 24350.00, loja: 'LAURO_FREITAS', data: '2026-07-28' },
      { id: '978121', fornecedor: 'BOTICÁRIO', cnpj: '29260806147451', tipo: 'Entrada', status: 'NO PRAZO', integrado: true, valor: 18900.00, loja: 'LAURO_FREITAS', data: '2026-08-15' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('SIMOES_FILHO');
      const [searchTerm, setSearchTerm] = useState('');
      const [statusFilter, setStatusFilter] = useState('Todos');
      
      // RANGE PADRÃO PARA EXIBIR JULHO E AGOSTO DE 2026
      const [startDate, setStartDate] = useState('2026-07-01');
      const [endDate, setEndDate] = useState('2026-08-31');
      
      const [notes, setNotes] = useState(INITIAL_NOTES);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiChatOpen, setAiChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'gemini', text: 'Olá! Sou o Gemini, assistente corporativo Boticário. Como posso ajudar com o recebimento das notas nas unidades da Bahia?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // FILTRAGEM DOS DADOS
      const filteredNotes = notes.filter(n => {
        const matchTab = n.loja === activeTab;
        const matchSearch = n.id.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            n.fornecedor.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            n.cnpj.includes(searchTerm);
        const matchStatus = statusFilter === 'Todos' ? true : n.status === statusFilter;
        const matchDate = (!startDate || n.data >= startDate) && (!endDate || n.data <= endDate);
        return matchTab && matchSearch && matchStatus && matchDate;
      });

      const totalNotas = filteredNotes.length;
      const notasRecebidas = filteredNotes.filter(n => n.status === 'NO PRAZO' || n.status === 'DENTRO DO PRAZO').length;
      const pendentesIntegracao = filteredNotes.filter(n => n.status === 'FORA DO PRAZO' || n.status === 'PENDENTE INTEGRACAO').length;
      const notasIntegradasCount = filteredNotes.filter(n => n.integrado).length;

      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        const labels = ['SIMÕES FILHO', 'PITUBA', 'CAJAZEIRAS', 'CALÇADA', 'LAURO DE FREITAS'];
        const storeKeys = ['SIMOES_FILHO', 'PITUBA', 'CAJAZEIRAS', 'CALCADA', 'LAURO_FREITAS'];

        const integradasData = storeKeys.map(k => notes.filter(n => n.loja === k && n.integrado && (!startDate || n.data >= startDate) && (!endDate || n.data <= endDate)).length);
        const pendentesData = storeKeys.map(k => notes.filter(n => n.loja === k && !n.integrado && (!startDate || n.data >= startDate) && (!endDate || n.data <= endDate)).length);

        chartInstance.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: 'Notas Integradas / No Prazo', data: integradasData, backgroundColor: '#10b981', borderRadius: 6 },
              { label: 'Pendentes / Fora do Prazo', data: pendentesData, backgroundColor: '#ef4444', borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: 'Acompanhamento de NFs (Julho/Agosto 2026)', font: { size: 14, weight: 'bold' } }
            },
            scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
          }
        });
      }, [notes, startDate, endDate, activeTab]);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const handleSimulateAiUpload = () => {
        setIsAnalyzing(true);
        setTimeout(() => {
          const newNote = {
            id: `${Math.floor(900000 + Math.random() * 90000)}`,
            fornecedor: 'BOTICÁRIO LOGÍSTICA',
            cnpj: '29260806147451',
            tipo: 'Entrada',
            status: 'NO PRAZO',
            integrado: true,
            valor: 15400.00,
            loja: activeTab,
            data: '2026-08-21'
          };
          setNotes([newNote, ...notes]);
          setIsAnalyzing(false);
          setIsModalOpen(false);
        }, 1800);
      };

      const handleSendMessage = () => {
        if (!chatInput.trim()) return;
        const newMsgs = [...chatMessages, { sender: 'user', text: chatInput }];
        setChatMessages(newMsgs);
        setChatInput('');
        setTimeout(() => {
          setChatMessages([...newMsgs, { sender: 'gemini', text: `Analisando a base do Grupo Boticário... Encontrei ${totalNotas} notas na aba selecionada.` }]);
        }, 1000);
      };

      const getStatusStyle = (status) => {
        switch(status) {
          case 'NO PRAZO':
          case 'DENTRO DO PRAZO':
            return 'bg-emerald-900 text-emerald-100 border-emerald-700';
          case 'FORA DO PRAZO':
            return 'bg-red-900 text-red-100 border-red-700';
          case 'PENDENTE INTEGRACAO':
            return 'bg-amber-100 text-amber-900 border-amber-300';
          default:
            return 'bg-slate-800 text-white';
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* CABEÇALHO COM A LOGOMARCA OFICIAL DO GRUPO BOTICÁRIO */}
          <header className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm sticky top-0 z-30">
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-3">
                <img 
                  src="https://upload.wikimedia.org/wikipedia/commons/2/23/Logo_Grupo_Boticario.svg" 
                  alt="Grupo Boticário" 
                  className="h-10 object-contain"
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = "https://raw.githubusercontent.com/github/explore/main/topics/javascript/javascript.png";
                  }}
                />
                <span className="text-slate-300 text-2xl font-light">|</span>
                <span className="font-semibold text-slate-800 text-sm tracking-tight">Recebimentos Bahia</span>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="hidden sm:inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-medium border border-emerald-200">
                <i data-lucide="shield-check" className="w-4 h-4"></i> Acesso Restrito a Funcionários
              </span>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-slate-900">Notas Fiscais</h1>
                <p className="text-xs md:text-sm text-slate-500">Gerencie, consulte e acompanhe suas NF-e por loja</p>
              </div>
              <button onClick={() => setIsModalOpen(true)} className="bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm px-4 py-2.5 rounded-lg flex items-center gap-2 shadow transition">
                <i data-lucide="plus" className="w-4 h-4"></i> Nova Nota
              </button>
            </div>

            {/* ABAS UNIFICADAS */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 border-b border-slate-200">
              {STORES.map((s) => {
                const count = notes.filter(n => n.loja === s.id && (!startDate || n.data >= startDate) && (!endDate || n.data <= endDate)).length;
                const isActive = activeTab === s.id;
                return (
                  <button key={s.id} onClick={() => setActiveTab(s.id)} className={`px-4 py-2 text-xs font-semibold rounded-t-lg flex items-center gap-2 border-b-2 whitespace-nowrap transition ${isActive ? 'border-slate-900 text-slate-900 bg-white shadow-sm' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}>
                    <span>{s.label}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[10px] ${isActive ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-600'}`}>{count}</span>
                  </button>
                );
              })}
            </div>

            {/* CARDS DE MÉTRICAS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Total de Notas</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{totalNotas}</p></div>
                <div className="p-2.5 bg-slate-100 text-slate-600 rounded-lg"><i data-lucide="file-text" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">No Prazo</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{notasRecebidas}</p></div>
                <div className="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle-2" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Fora do Prazo / Pendente</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{pendentesIntegracao}</p></div>
                <div className="p-2.5 bg-red-50 text-red-500 rounded-lg"><i data-lucide="alert-circle" className="w-5 h-5"></i></div>
              </div>
              <div className="bg-white p-4 rounded-xl border shadow-sm flex items-center justify-between">
                <div><p className="text-[11px] font-bold uppercase text-slate-400">Notas Integradas</p><p className="text-2xl font-extrabold text-slate-800 mt-1">{notasIntegradasCount}</p></div>
                <div className="p-2.5 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="clock" className="w-5 h-5"></i></div>
              </div>
            </div>

            {/* GRÁFICO DA BAHIA */}
            <div className="bg-white p-5 rounded-xl border shadow-sm">
              <div className="h-64 w-full"><canvas ref={chartRef}></canvas></div>
            </div>

            {/* FILTROS DE PESQUISA E DATAS */}
            <div className="bg-white p-4 rounded-xl border shadow-sm space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                <div className="md:col-span-5 relative">
                  <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                  <input type="text" placeholder="Buscar por número, emitente, CNPJ..." className="w-full pl-9 pr-3 py-2 text-xs border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                </div>
                <div className="md:col-span-4 flex items-center gap-2 bg-emerald-50/60 border border-emerald-200 px-3 py-1.5 rounded-full text-xs text-emerald-900">
                  <i data-lucide="calendar" className="w-4 h-4 text-emerald-700"></i>
                  <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-transparent text-xs text-emerald-800 focus:outline-none" />
                  <span className="text-emerald-500">—</span>
                  <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-transparent text-xs text-emerald-800 focus:outline-none" />
                </div>
                <div className="md:col-span-3">
                  <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="w-full py-2 px-3 text-xs border rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white">
                    <option value="Todos">Todos os status</option>
                    <option value="NO PRAZO">NO PRAZO / DENTRO DO PRAZO</option>
                    <option value="FORA DO PRAZO">FORA DO PRAZO</option>
                    <option value="PENDENTE INTEGRACAO">PENDENTE INTEGRACAO</option>
                  </select>
                </div>
              </div>
            </div>

            {/* TABELA DE DADOS DA BAHIA */}
            <div className="bg-white rounded-xl border shadow-sm overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs text-slate-600">
                  <thead className="bg-slate-50 border-b text-slate-700 font-semibold uppercase">
                    <tr><th className="p-4">Número/Série</th><th className="p-4">Tipo</th><th className="p-4">Status</th><th className="p-4">Data Emissão</th><th className="p-4">Valor Total</th><th className="p-4 text-center">Ações</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredNotes.length > 0 ? (
                      filteredNotes.map((note) => (
                        <tr key={note.id} className="hover:bg-slate-50 transition">
                          <td className="p-4"><div className="font-bold text-slate-900">{note.id}</div><div className="text-[11px] text-slate-400">{note.fornecedor}</div></td>
                          <td className="p-4"><span className="bg-slate-100 px-2 py-0.5 rounded text-[11px] border">{note.tipo}</span></td>
                          <td className="p-4">
                            <span className={`px-2.5 py-1 rounded text-[10px] font-bold border inline-block ${getStatusStyle(note.status)}`}>
                              {note.status}
                            </span>
                          </td>
                          <td className="p-4 font-medium text-slate-700">{note.data.split('-').reverse().join('/')}</td>
                          <td className="p-4 font-bold text-slate-900">R$ {note.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                          <td className="p-4 text-center"><div className="flex justify-center gap-3 text-slate-400"><i data-lucide="eye" className="w-4 h-4 cursor-pointer hover:text-slate-800"></i><i data-lucide="pencil" className="w-4 h-4 cursor-pointer hover:text-slate-800"></i><i data-lucide="trash-2" className="w-4 h-4 cursor-pointer hover:text-red-500"></i></div></td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="6" className="p-8 text-center text-slate-400">
                          Nenhuma nota fiscal encontrada para o período selecionado.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* CHATBOT GEMINI INTEGRADO */}
          <div className="fixed bottom-5 right-5 z-40">
            {aiChatOpen ? (
              <div className="bg-white rounded-2xl shadow-2xl border w-80 sm:w-96 flex flex-col h-96 overflow-hidden">
                <div className="bg-slate-900 text-white p-3.5 flex justify-between items-center">
                  <div className="flex items-center gap-2"><div className="p-1 bg-emerald-500 rounded text-white"><i data-lucide="bot" className="w-4 h-4"></i></div><span className="font-bold text-xs">Gemini (Boticário)</span></div>
                  <button onClick={() => setAiChatOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs bg-slate-50">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`max-w-[80%] p-2.5 rounded-xl ${msg.sender === 'user' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-700 shadow-sm'}`}>{msg.text}</div>
                    </div>
                  ))}
                </div>
                <div className="p-2 border-t bg-white flex gap-1.5">
                  <input type="text" placeholder="Pergunte sobre NFs..." className="flex-1 border rounded-lg px-3 py-1.5 text-xs focus:outline-none" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()} />
                  <button onClick={handleSendMessage} className="bg-slate-900 text-white p-2 rounded-lg"><i data-lucide="send" className="w-3.5 h-3.5"></i></button>
                </div>
              </div>
            ) : (
              <button onClick={() => setAiChatOpen(true)} className="bg-slate-900 text-white p-3.5 rounded-full shadow-lg flex items-center gap-2 hover:bg-slate-800"><i data-lucide="sparkles" className="w-5 h-5 text-emerald-400"></i><span className="text-xs font-semibold pr-1">Gemini AI</span></button>
            )}
          </div>

          {/* MODAL OCR */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-800 text-base">Nova Nota Fiscal (Gemini OCR)</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                <div className="border-2 border-dashed rounded-xl p-6 text-center space-y-3 bg-slate-50">
                  <i data-lucide="upload-cloud" className="w-10 h-10 text-slate-400 mx-auto"></i>
                  <p className="text-xs text-slate-600 font-semibold">Arraste seu arquivo PDF/XML da NF</p>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 border text-xs rounded-lg text-slate-600">Cancelar</button>
                  <button onClick={handleSimulateAiUpload} disabled={isAnalyzing} className="px-4 py-2 bg-slate-900 text-white text-xs rounded-lg">{isAnalyzing ? 'Processando IA...' : 'Simular Leitura Gemini'}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
